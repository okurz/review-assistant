apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: review-assistant
resources:
  - ../openplatform
  - ../../job-dry-run
images:
  - name: ghcr.io/os-autoinst/review-assistant
    newName: ghcr.io/os-autoinst/review-assistant
    newTag: latest
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: review-assistant
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
