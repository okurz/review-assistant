[project]
name = "review-assistant"
version = "0.1.0"
description = "Model-based automated pull request review for os-autoinst/openQA."
readme = "Readme.md"
requires-python = "~=3.13.0"
license = "MIT"
authors = [
    { name = "SUSE LLC" },
]
dependencies = [
    "requests",
    "PyYAML",
    "pydantic-settings",
    "python-dotenv",
]

[project.urls]
Homepage = "https://progress.opensuse.org/issues/210027"

[project.scripts]
review-assistant = "review_assistant.cli:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-env==1.7.0",
    "pytest-xdist==3.8.0",
    "pyupgrade==3.21.2",
    "coverage==7.15.4",
    "ruff==0.16.2",
    "pytest-mock==3.15.1",
    "vulture==2.16",
    "ty==0.0.72",
    "pre-commit==4.6.1",
    "gitlint==0.19.1",
    "radon==6.0.1",
    "responses==0.25.7",
]

[tool.setuptools.packages]
find = {}
